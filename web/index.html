<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流程工坊 · Workflow Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231F4FD8'/%3E%3Cpath d='M8 10h10M8 16h16M8 22h7' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app" data-view="canvas">
      <header class="top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">流程工坊</span>
          <span id="meta-version" class="brand-meta">Workflow Studio</span>
        </div>

        <nav class="views" role="tablist" aria-label="视图">
          <button type="button" data-view-btn="canvas" class="is-on" role="tab" aria-selected="true">画布</button>
          <button type="button" data-view-btn="board" role="tab" aria-selected="false">看板</button>
        </nav>

        <div class="top-right">
          <span id="conn" class="conn" title="实时连接状态"><i></i><em>连接中</em></span>
          <button type="button" id="btn-refresh" class="btn" title="重新读取">刷新</button>
          <button type="button" id="btn-new-workflow" class="btn btn-primary">新建流程</button>
        </div>
      </header>

      <div class="body">
        <aside class="rail" aria-label="流程列表">
          <div class="rail-head">
            <span>流程</span>
            <b id="wf-count">0</b>
          </div>
          <ul id="wf-list" class="wf-list"></ul>
          <div class="rail-foot">
            <div class="dir-line">
              <span>数据目录</span>
              <button id="btn-data-dir" type="button" class="link" title="更换数据目录">更改</button>
            </div>
            <code id="data-dir">—</code>
          </div>
        </aside>

        <main class="main">
          <div class="wf-bar">
            <div class="wf-bar-left">
              <div id="wf-crumbs" class="crumbs" hidden></div>
              <div class="wf-title">
                <h1 id="wf-name">未选择流程</h1>
                <span id="wf-status" class="state">—</span>
              </div>
              <p id="wf-goal" class="wf-goal">从左侧选择一个流程，或者新建一个。</p>
              <div id="wf-signature" class="sig" hidden></div>
            </div>

            <div class="wf-bar-right">
              <div class="meter">
                <div class="meter-track"><i id="wf-progress-bar"></i></div>
                <span id="wf-progress-text" class="meter-value">0%</span>
                <span id="wf-progress-detail" class="meter-note">0 / 0</span>
              </div>
              <div class="wf-actions">
                <button type="button" id="btn-edit-workflow" class="btn" disabled>编辑</button>
                <button type="button" id="btn-add-event" class="btn btn-primary" disabled>＋ 事件</button>
              </div>
            </div>
          </div>

          <section id="next-strip" class="next" aria-label="下一步"></section>

          <section id="board" class="board" aria-label="事件看板"></section>

          <section id="canvas-view" class="canvas-view" aria-label="矩阵画布" hidden>
            <div id="canvas-viewport" class="viewport">
              <div id="canvas-world" class="world">
                <svg id="canvas-edges" class="edges" aria-hidden="true">
                  <defs>
                    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0 0 L8 3 L0 6 z" class="head head-flow" />
                    </marker>
                    <marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0 0 L8 3 L0 6 z" class="head head-data" />
                    </marker>
                    <marker id="arrow-gate" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
                      <path d="M0 0 L8 4 L0 8 L2 4 z" class="head head-gate" />
                    </marker>
                  </defs>
                </svg>
                <div id="canvas-nodes" class="nodes"></div>
              </div>
            </div>

            <div class="canvas-tools" aria-label="画布工具">
              <button type="button" data-canvas="zoom-out" title="缩小">−</button>
              <button type="button" data-canvas="zoom" id="canvas-zoom" class="zoom-label" title="重置为 100%">100%</button>
              <button type="button" data-canvas="zoom-in" title="放大">＋</button>
              <button type="button" data-canvas="fit" title="适应窗口">适应</button>
              <button type="button" data-canvas="auto" title="按依赖重新排版">排版</button>
            </div>

            <div class="legend">
              <span><i class="rule"></i>顺序</span>
              <span><i class="rule rule-data"></i>数据</span>
              <span><i class="rule rule-gate"></i>验收</span>
            </div>
          </section>

          <div id="empty" class="empty" hidden>
            <div class="empty-art" aria-hidden="true">
              <svg viewBox="0 0 136 88" width="150" height="97">
                <rect x="8" y="12" width="42" height="26" class="empty-box" />
                <rect x="86" y="12" width="42" height="26" class="empty-box" />
                <rect x="47" y="52" width="42" height="26" class="empty-box" />
                <path d="M50 25h36M64 38v8h15v6" class="empty-line" fill="none" />
              </svg>
            </div>
            <h3>还没有流程</h3>
            <p>把一个项目的分工拆成矩阵：谁先做、谁依赖谁、每步要交出什么。</p>
            <button type="button" id="btn-empty-create" class="btn btn-primary">新建第一个流程</button>
          </div>
        </main>

        <aside id="inspector" class="inspector" hidden aria-label="事件详情"></aside>
      </div>

      <footer class="status">
        <span id="status-msg">就绪</span>
        <span id="counts" class="status-counts"></span>
        <span class="status-hint">拖动矩阵 · 双击编辑 · 滚轮缩放</span>
      </footer>
    </div>

    <dialog id="dialog-workflow" class="dialog">
      <form method="dialog" class="dialog-form" id="form-workflow">
        <header>
          <h3 id="dialog-workflow-title">新建流程</h3>
          <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
        </header>
        <label class="field">
          <span>名称</span>
          <input name="name" required maxlength="120" placeholder="例如：DSH 插件发布 v1" autocomplete="off" />
        </label>
        <label class="field">
          <span>目标<em>可选</em></span>
          <textarea name="goal" rows="2" placeholder="这个流程要拿到什么结果"></textarea>
        </label>
        <label class="field" id="field-template">
          <span>起始模板</span>
          <div class="template-grid" id="template-grid"></div>
        </label>
        <footer>
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary">创建</button>
        </footer>
      </form>
    </dialog>

    <dialog id="dialog-event" class="dialog">
      <form method="dialog" class="dialog-form" id="form-event">
        <header>
          <h3 id="dialog-event-title">新建事件</h3>
          <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
        </header>
        <label class="field">
          <span>标题</span>
          <input name="title" required maxlength="160" placeholder="例如：锁定接口契约" autocomplete="off" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>职能层</span>
            <select name="layerId" id="event-layer"></select>
          </label>
          <label class="field">
            <span>角色<em>可选</em></span>
            <input name="role" maxlength="60" placeholder="例如：架构师" autocomplete="off" />
          </label>
        </div>
        <label class="field">
          <span>依赖<em>可选</em></span>
          <div class="dep-picker" id="dep-picker"></div>
        </label>
        <label class="field">
          <span>待办<em>每行一条</em></span>
          <textarea name="tasks" rows="3" placeholder="写接口文档&#10;评审命名"></textarea>
        </label>
        <footer>
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="dialog-data-dir" class="dialog dialog-narrow">
      <form method="dialog" class="dialog-form" id="form-data-dir">
        <header>
          <h3>数据目录</h3>
          <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
        </header>
        <p class="note" id="data-dir-note">流程会以 JSON 文件存在这个目录下，换目录后新写入都到新位置。</p>
        <label class="field">
          <span>绝对路径</span>
          <input name="dataDir" id="data-dir-input" required spellcheck="false" autocomplete="off" placeholder="D:\DSH Workplace\workflow-studio" />
        </label>
        <div id="data-dir-options">
          <div class="drive-row" id="drive-row"></div>
          <label class="check">
            <input type="checkbox" name="migrate" id="data-dir-migrate" checked />
            <span>把现有流程复制过去</span>
          </label>
        </div>
        <footer>
          <button type="button" class="btn" id="btn-data-dir-reset">恢复默认</button>
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary" id="btn-data-dir-apply">切换</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
